# Build and sign the APK when a version tag (v1.2.3) is pushed, publish it, and point latest.json at it.
# Node, git and npm come prebuilt from the "natives" release (tools/natives.mjs --zip); see README.
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Natives
        run: |
          gh release download natives -p natives.zip -D /tmp
          mkdir -p android/build/natives
          unzip -q /tmp/natives.zip -d android/build/natives

      - name: Build
        working-directory: android
        env:
          TAVERN_VERSION_CODE: ${{ github.run_number }}
          TAVERN_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/manifest/latest.json
          TAVERN_KEYSTORE: ${{ runner.temp }}/release.keystore
          TAVERN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAVERN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAVERN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then name="${{ github.ref_name }}"; export TAVERN_VERSION_NAME="${name#v}"
          else export TAVERN_VERSION_NAME="0.0.${{ github.run_number }}"; fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$TAVERN_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$TAVERN_KEYSTORE"

      - name: Publish
        if: github.ref_type == 'tag'
        run: |
          tag="${{ github.ref_name }}"
          apk="chiyao-tavern-$tag.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          # the annotated tag's message is the release notes; checkout leaves only the commit
          git fetch -q --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.txt
          gh release create "$tag" "$apk" --title "吃药酒馆 $tag" --notes-file notes.txt
          gh release download manifest -p latest.json -D manifest 2>/dev/null || mkdir -p manifest
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$apk"
          node tools/manifest.mjs manifest/latest.json shell "${{ github.run_number }}" "${tag#v}" "$url" "$apk" notes.txt
          gh release view manifest >/dev/null 2>&1 || \
            gh release create manifest --title "Update manifest" --notes "latest.json for the app's update check." --latest=false
          gh release upload manifest manifest/latest.json --clobber
